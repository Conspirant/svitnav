<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="16" fill="#141824"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#334155" stroke-width="2"/>
  
  <!-- Subtle radar/map grid lines -->
  <line x1="32" y1="8" x2="32" y2="56" stroke="#1E293B" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="8" y1="32" x2="56" y2="32" stroke="#1E293B" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="18" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="2 4"/>

  <!-- Glowing Navigation Arrow / Waypoint Pin -->
  <defs>
    <linearGradient id="pinGrad" x1="16" y1="12" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="12" y="8" width="40" height="46" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Navigation Compass / Dynamic Chevron -->
  <path d="M32 12L46 44L32 37L18 44L32 12Z" fill="url(#pinGrad)" filter="url(#glow)"/>
  <path d="M32 12L32 37L46 44L32 12Z" fill="#F59E0B" opacity="0.8"/>
  <circle cx="32" cy="30" r="3" fill="#FFFFFF"/>
</svg>
